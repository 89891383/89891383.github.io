<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>SŁABY ZASIĘG</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: grid;
            place-items: stretch;
            font-family: "Lato", sans-serif;
            font-weight: 900;
            background: transparent;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: absolute;
            width: calc(100% - 100px);
            height: calc(100% - 100px);
            margin: 50px;
            z-index: 200;
        }

        .box {
            max-width: 75vw;
            max-height: 75vh;
            text-align: center;
            padding: 5px 20px;
            background: rgba(86, 86, 86, 0.6);
            border: 1px solid rgb(141, 141, 141);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            overflow: hidden;
        }

        .box p {
            color: #fff;
            font-size: 4rem;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Odstęp między tekstem a ikoną */
        }

        .box p svg {
            height: 4rem;
            width: auto;
            display: block;
        }
    </style>
</head>
