<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@700;800;900&family=Bungee&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050308;
      font-family: system-ui, sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    /* ===== CASINO FIRE BARS ===== */
    .donate-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      z-index: 30;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 40, 80, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 100%, rgba(255, 200, 0, 0.12) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 100%, rgba(180, 0, 255, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, #12081a 0%, #0a0610 100%);
    }

    .donate-bar.top { border-bottom: 1px solid rgba(255, 215, 0, 0.28); }
    .donate-bar.bottom { border-top: 1px solid rgba(255, 215, 0, 0.28); }

    /* moving glitter layer */
    .donate-bar::before {
      content: "";
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.15) 0%, transparent 4%),
        radial-gradient(circle at 70% 60%, rgba(255, 50, 100, 0.12) 0%, transparent 3%),
        radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.08) 0%, transparent 2%),
        radial-gradient(circle at 85% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 3%);
      animation: glitter 6s linear infinite;
      pointer-events: none;
    }

    @keyframes glitter {
      0%   { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-8%, 6%) rotate(8deg); }
    }

    /* laser scan */
    .donate-bar::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 30%;
      left: -30%;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.12), rgba(255, 50, 120, 0.1), transparent);
      animation: laser 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes laser {
      0%   { left: -30%; }
      100% { left: 100%; }
    }

    .chip {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 20px rgba(255, 50, 100, 0.3));
      animation: chip-spin 6s linear infinite, chip-bob 2s ease-in-out infinite;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .chip.reverse { animation-direction: reverse, alternate; }

    @keyframes chip-spin {
      from { transform: rotate(0deg) scale(1); }
      to   { transform: rotate(360deg) scale(1); }
    }

    @keyframes chip-bob {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
      50%      { filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 30px rgba(255, 50, 100, 0.4)); }
    }

    .tag-777 {
      font-family: "Bungee", "Black Ops One", Impact, sans-serif;
      font-size: 26px;
      background: linear-gradient(180deg, #fff7c2 0%, #ffd700 40%, #ff6b00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(255, 180, 0, 0.7));
      letter-spacing: 0.04em;
      animation: neon-777 2.5s ease-in-out infinite;
      flex-shrink: 0;
      user-select: none;
      position: relative;
      z-index: 2;
    }

    @keyframes neon-777 {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.6)) brightness(1); transform: scale(1); }
      40%      { filter: drop-shadow(0 0 14px rgba(255, 80, 0, 0.9)) brightness(1.25); transform: scale(1.08); }
      55%      { filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.5)) brightness(0.9); transform: scale(0.98); }
      70%      { filter: drop-shadow(0 0 16px rgba(255, 215, 0, 1)) brightness(1.3); transform: scale(1.06); }
    }

    .fa-deco {
      font-size: 18px;
      color: #ffd700;
      animation: icon-pulse 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
      position: relative;
      z-index: 2;
    }

    .fa-deco.pink {
      color: #ff4d8d;
      filter: drop-shadow(0 0 6px rgba(255, 50, 120, 0.6));
      animation-delay: 0.3s;
    }

    @keyframes icon-pulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
      50%      { transform: scale(1.25) rotate(12deg); opacity: 1; }
    }

    /* ===== THE DONATE BUTTON – FULL SEND ===== */
    .donate {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: min(380px, 72vw);
      padding: 14px 40px;
      border: 2px solid #ffe566;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: #1a0500;
      font-family: "Orbitron", "Bungee", Impact, sans-serif;
      font-weight: 900;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(
        120deg,
        #fff3a0 0%,
        #ffd700 20%,
        #ff9f1a 40%,
        #ff2d6a 55%,
        #ff9f1a 70%,
        #ffd700 85%,
        #fff3a0 100%
      );
      background-size: 300% 100%;
      box-shadow:
        0 0 0 2px rgba(0, 0, 0, 0.5),
        0 0 24px rgba(255, 215, 0, 0.45),
        0 0 48px rgba(255, 45, 106, 0.25),
        0 6px 20px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      animation:
        gold-rush 3s linear infinite,
        explode-glow 1.8s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-font-smoothing: antialiased;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      overflow: hidden;
      z-index: 3;
    }

    /* shine blade */
    .donate::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -40%;
      width: 35%;
      height: 140%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-24deg);
      animation: blade 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes blade {
      0%, 30% { left: -40%; opacity: 0; }
      40%     { opacity: 1; }
      70%, 100% { left: 110%; opacity: 0; }
    }

    /* ring burst */
    .donate::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 16px;
      border: 2px solid rgba(255, 215, 0, 0.5);
      animation: ring-burst 2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes ring-burst {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    @keyframes gold-rush {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes explode-glow {
      0%, 100% {
        box-shadow:
          0 0 0 2px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(255, 215, 0, 0.4),
          0 0 40px rgba(255, 45, 106, 0.2),
          0 6px 20px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }
      50% {
        box-shadow:
          0 0 0 2px rgba(0, 0, 0, 0.5),
          0 0 36px rgba(255, 215, 0, 0.75),
          0 0 70px rgba(255, 45, 106, 0.4),
          0 6px 20px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }
    }

    .donate:hover {
      transform: scale(1.08) rotate(-0.5deg);
    }

    .donate:active {
      transform: scale(0.96);
    }

    .donate .ico {
      display: inline-flex;
      animation: ico-wiggle 1.2s ease-in-out infinite;
      font-size: 0.95em;
    }

    .donate .ico:last-child {
      animation-delay: 0.2s;
    }

    @keyframes ico-wiggle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25%      { transform: scale(1.3) rotate(-15deg); }
      50%      { transform: scale(1) rotate(0deg); }
      75%      { transform: scale(1.25) rotate(15deg); }
    }

    /* floating sparks next to button (pseudo via spans) */
    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffd700;
      pointer-events: none;
      animation: spark-fly 2s ease-out infinite;
      opacity: 0;
    }

    @keyframes spark-fly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
    }

    /* ===== MIDDLE ===== */
    .layout {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      width: 100%;
    }

    .player {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      background: #000;
      position: relative;
    }

    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .divider {
      flex: 0 0 4px;
      width: 4px;
      height: 100%;
      background: #1a1025;
      cursor: col-resize;
      position: relative;
      z-index: 20;
      transition: background 0.15s;
      touch-action: none;
      user-select: none;
    }

    .divider::after {
      content: "";
      position: absolute;
      top: 0; left: -5px; right: -5px; bottom: 0;
    }

    .divider:hover,
    .divider.active {
      background: linear-gradient(180deg, #ffd700, #ff2d6a);
    }

    .chat {
      flex: 0 0 var(--chat-w, 360px);
      width: var(--chat-w, 360px);
      height: 100%;
      background: #08060c;
      position: relative;
      min-width: 0;
    }

    .chat iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 768px) {
      .donate-bar {
        padding: 8px 8px;
        gap: 6px;
      }

      .chip { width: 32px; height: 32px; }
      .tag-777 { font-size: 16px; }
      .fa-deco { font-size: 13px; display: none; }

      .donate {
        min-width: 0;
        flex: 1 1 auto;
        padding: 11px 14px;
        font-size: 14px;
        letter-spacing: 0.12em;
        gap: 8px;
      }

      .layout { flex-direction: column; }

      .player {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
      }

      .divider {
        flex: 0 0 4px;
        width: 100%;
        height: 4px;
        cursor: row-resize;
      }

      .divider::after {
        top: -5px; bottom: -5px; left: 0; right: 0;
      }

      .chat {
        flex: 0 0 var(--chat-h, 38%);
        width: 100%;
        height: var(--chat-h, 38%);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- TOP BAR -->
    <div class="donate-bar top">
      <img class="chip" src="https://i.nuuls.com/Wg1BV.png" alt="" />
      <i class="fa-solid fa-dice fa-deco"></i>
      <span class="tag-777">777</span>
      <i class="fa-solid fa-fire fa-deco pink"></i>

      <a class="donate" href="https://tipply.pl/@trazer" target="_blank" rel="noopener noreferrer">
        <span class="ico"><i class="fa-solid fa-sack-dollar"></i></span>
        DONATE
        <span class="ico"><i class="fa-solid fa-gem"></i></span>
      </a>

      <i class="fa-solid fa-fire fa-deco pink"></i>
      <span class="tag-777">777</span>
      <i class="fa-solid fa-slot-machine fa-deco"></i>
      <img class="chip reverse" src="https://i.nuuls.com/Wg1BV.png" alt="" />
    </div>

    <div class="layout" id="layout">
      <div class="player" id="player">
        <iframe
          src="https://ok.ru/videoembed/16315266244202?nochat=1&autoplay=1"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <div class="divider" id="divider" title="Przeciągnij"></div>
      <div class="chat" id="chat">
        <iframe
          src="https://chat.kick.cx/embed/trazer"
          allow="clipboard-write"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="donate-bar bottom">
      <img class="chip reverse" src="https://i.nuuls.com/Wg1BV.png" alt="" />
      <i class="fa-solid fa-coins fa-deco"></i>
      <span class="tag-777">777</span>
      <i class="fa-solid fa-heart fa-deco pink"></i>

      <a class="donate" href="https://kick.com/trazer" target="_blank" rel="noopener noreferrer">
        <span class="ico"><i class="fa-solid fa-champagne-glasses"></i></span>
        DONATE
        <span class="ico"><i class="fa-solid fa-crown"></i></span>
      </a>

      <i class="fa-solid fa-heart fa-deco pink"></i>
      <span class="tag-777">777</span>
      <i class="fa-solid fa-dice-d6 fa-deco"></i>
      <img class="chip" src="https://i.nuuls.com/Wg1BV.png" alt="" />
    </div>
  </div>

  <script>
    (function () {
      const layout = document.getElementById("layout");
      const divider = document.getElementById("divider");
      const chat = document.getElementById("chat");
      const isMobile = () => window.matchMedia("(max-width: 768px)").matches;
      let dragging = false;

      function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

      function applyDesktop(x) {
        const r = layout.getBoundingClientRect();
        let w = clamp(r.width - (x - r.left), 220, r.width * 0.55);
        document.documentElement.style.setProperty("--chat-w", w + "px");
        chat.style.flex = "0 0 " + w + "px";
        chat.style.width = w + "px";
        chat.style.height = "";
      }

      function applyMobile(y) {
        const r = layout.getBoundingClientRect();
        let h = clamp(r.height - (y - r.top), r.height * 0.2, r.height * 0.65);
        const pct = (h / r.height) * 100;
        document.documentElement.style.setProperty("--chat-h", pct + "%");
        chat.style.flex = "0 0 " + pct + "%";
        chat.style.height = pct + "%";
        chat.style.width = "100%";
      }

      function onMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const p = e.touches ? e.touches[0] : e;
        isMobile() ? applyMobile(p.clientY) : applyDesktop(p.clientX);
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove("active");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      }

      function onDown(e) {
        dragging = true;
        divider.classList.add("active");
        document.body.style.cursor = isMobile() ? "row-resize" : "col-resize";
        document.body.style.userSelect = "none";
        e.preventDefault();
      }

      divider.addEventListener("mousedown", onDown);
      divider.addEventListener("touchstart", onDown, { passive: false });
      window.addEventListener("mousemove", onMove, { passive: false });
      window.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("mouseup", onUp);
      window.addEventListener("touchend", onUp);

      window.addEventListener("resize", function () {
        if (isMobile()) {
          chat.style.width = "100%";
          if (!chat.style.height) chat.style.flex = "0 0 38%";
        } else {
          chat.style.height = "";
          if (!chat.style.width || chat.style.width === "100%") {
            chat.style.flex = "0 0 360px";
            chat.style.width = "360px";
          }
        }
      });
    })();
  </script>
</body>
</html>
