<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08080b" />
  <title>AKTOR • Stream</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

  <style>
    :root {
      --bg: #08080b;
      --surface: #0f0f14;
      --surface-2: #16161d;
      --surface-3: #1e1e27;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f4f4f7;
      --muted: #9b9bab;
      --accent: #53fc18;
      --gold: #ffb52e;
      --pink: #ff4d88;
      --discord: #5865f2;
      --radius: 16px;
      --gap: 10px;
      --divider: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background:
        radial-gradient(900px 400px at 10% -10%, rgba(83, 252, 24, 0.07), transparent 60%),
        radial-gradient(800px 400px at 95% -10%, rgba(88, 101, 242, 0.1), transparent 60%),
        var(--bg);
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .app {
      display: flex; flex-direction: column;
      width: 100%; height: 100%; height: 100dvh;
    }

    /* ================= TOPBAR ================= */
    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 14px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: rgba(15, 15, 20, 0.72);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid var(--line);
      z-index: 40;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px; flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: 12px; font-size: 18px; color: #07110a;
      background: linear-gradient(135deg, #8dff5c 0%, #53fc18 50%, #2fc400 100%);
      box-shadow: 0 6px 22px rgba(83, 252, 24, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
    .brand-name {
      font-weight: 900; font-size: 20px; letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .brand-sub {
      display: flex; align-items: center; gap: 6px; margin-top: 3px;
      font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ff3b4e;
      box-shadow: 0 0 0 0 rgba(255, 59, 78, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 78, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(255, 59, 78, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 78, 0); }
    }

    .spacer { flex: 1 1 auto; }

    .actions { display: flex; align-items: center; gap: 8px; }
    .tools { display: flex; align-items: center; gap: 6px; }
    .sep { width: 1px; height: 24px; background: var(--line-strong); margin: 0 4px; }

    .btn {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      height: 42px; padding: 0 18px; border-radius: 12px;
      font-weight: 700; font-size: 13.5px; letter-spacing: 0.02em; white-space: nowrap;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); background: var(--surface-3); }
    .btn:active { transform: translateY(0) scale(0.97); }
    .btn i { font-size: 15px; }

    .btn-discord { background: rgba(88, 101, 242, 0.16); border-color: rgba(88, 101, 242, 0.45); color: #c9cdff; }
    .btn-discord:hover { background: var(--discord); border-color: var(--discord); color: #fff; box-shadow: 0 8px 26px rgba(88, 101, 242, 0.4); }

    .btn-kick { background: rgba(83, 252, 24, 0.1); border-color: rgba(83, 252, 24, 0.35); color: #c7ffae; }
    .btn-kick:hover { background: var(--accent); border-color: var(--accent); color: #06130a; box-shadow: 0 8px 26px rgba(83, 252, 24, 0.35); }
    .kick-ico {
      width: 18px; height: 18px; display: grid; place-items: center;
      border-radius: 5px; background: var(--accent); color: #06130a;
      font-weight: 900; font-size: 12px; line-height: 1;
    }
    .btn-kick:hover .kick-ico { background: #06130a; color: var(--accent); }

    .btn-donate {
      border: 0; color: #1a0b05; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      background: linear-gradient(120deg, #ffd35c 0%, #ffb52e 40%, #ff6b6b 100%);
      box-shadow: 0 8px 28px rgba(255, 140, 50, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    .btn-donate:hover { background: linear-gradient(120deg, #ffe07f 0%, #ffc04d 40%, #ff7b7b 100%); box-shadow: 0 12px 34px rgba(255, 140, 50, 0.5); }
    .btn-donate::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-22deg); animation: shine 4.5s ease-in-out infinite; pointer-events: none;
    }
    @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 140%; } }
    .btn-donate i { animation: beat 2.2s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }

    .icon-btn {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 12px; font-size: 16px; color: var(--muted);
      border: 1px solid transparent; position: relative;
      transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.18s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.on { color: var(--accent); background: rgba(83, 252, 24, 0.09); border-color: rgba(83, 252, 24, 0.22); }
    .icon-btn.spin i { animation: spin 0.7s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-btn:focus-visible, .btn:focus-visible, .divider:focus-visible, .cam-btn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ================= LAYOUT ================= */
    .layout {
      flex: 1 1 auto; min-height: 0; display: flex;
      padding: var(--gap);
      padding-left: max(var(--gap), env(safe-area-inset-left));
      padding-right: max(var(--gap), env(safe-area-inset-right));
    }

    .stage {
      flex: 1 1 auto; min-width: 0; min-height: 0; position: relative;
      background: #000; border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .stage:fullscreen, .stage:-webkit-full-screen { border-radius: 0; border: 0; }
    .stage > iframe.main {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1;
    }

    .loader {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 0;
      color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .loader .ring {
      width: 38px; height: 38px; margin: 0 auto 12px; border-radius: 50%;
      border: 3px solid var(--surface-3); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    .loader div { text-align: center; }

    /* ---- DIVIDER ---- */
    .divider {
      flex: 0 0 var(--divider); width: var(--divider); display: grid; place-items: center;
      cursor: col-resize; touch-action: none; user-select: none; position: relative; z-index: 20;
    }
    .divider::before { content: ""; position: absolute; inset: 0 -6px; }
    .divider .pill {
      width: 4px; height: 44px; border-radius: 4px; background: var(--line-strong);
      transition: background 0.18s, height 0.18s, width 0.18s;
    }
    .divider:hover .pill, .divider.active .pill, .divider:focus-visible .pill {
      background: var(--accent); height: 72px; box-shadow: 0 0 14px rgba(83, 252, 24, 0.5);
    }

    /* ---- CHAT ---- */
    .chat {
      flex: 0 0 min(var(--chat-w, 380px), 60%); width: min(var(--chat-w, 380px), 60%);
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); overflow: hidden;
    }
    .chat-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
    }
    .chat-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; }
    .chat-title i { color: var(--accent); }
    .chat-tag {
      font-size: 10px; font-weight: 700; color: var(--muted); padding: 3px 8px; border-radius: 999px;
      background: var(--surface-3); letter-spacing: 0.06em;
    }
    .chat-head .spacer { flex: 1; }
    .chat-head .icon-btn { width: 34px; height: 34px; font-size: 14px; border-radius: 10px; }
    .chat-body { position: relative; flex: 1 1 auto; min-height: 0; background: var(--surface); }
    .chat-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1; background: transparent; }

    .layout.chat-hidden .chat, .layout.chat-hidden .divider { display: none; }

    /* ================= WEBCAM ================= */
    .cam {
      position: absolute; z-index: 50; left: 0; top: 0;
      width: 280px; height: 157.5px;
      border-radius: 14px; overflow: hidden; background: #000;
      border: 1px solid var(--line-strong);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.6);
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      touch-action: none;
    }
    .cam.hidden { opacity: 0; pointer-events: none; transform: scale(0.85); }
    .cam.dragging { box-shadow: 0 22px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px var(--accent); transition: box-shadow 0.2s; }
    .cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

    .cam-bar {
      position: absolute; left: 0; right: 0; top: 0; height: 32px; z-index: 3;
      display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0));
      cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      opacity: 1; transition: opacity 0.18s;
    }
    .cam.dragging .cam-bar { cursor: grabbing; }
    .cam-label {
      display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); pointer-events: none;
    }
    .cam-label i { font-size: 11px; color: var(--accent); }
    .cam-btn {
      width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px;
      font-size: 11px; color: #fff; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px);
      transition: background 0.15s;
    }
    .cam-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .cam-btn.close:hover { background: #ff3b4e; }

    .rz {
      position: absolute; width: 24px; height: 24px; z-index: 4; touch-action: none;
      opacity: 0; transition: opacity 0.18s;
    }
    .rz::after {
      content: ""; position: absolute; width: 10px; height: 10px; border-color: var(--accent); border-style: solid; border-width: 0;
      filter: drop-shadow(0 0 4px rgba(83, 252, 24, 0.7));
    }
    .rz.tl { left: 0; top: 0; cursor: nwse-resize; } .rz.tl::after { left: 4px; top: 4px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 4px; }
    .rz.tr { right: 0; top: 0; cursor: nesw-resize; } .rz.tr::after { right: 4px; top: 4px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 4px; }
    .rz.bl { left: 0; bottom: 0; cursor: nesw-resize; } .rz.bl::after { left: 4px; bottom: 4px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 4px; }
    .rz.br { right: 0; bottom: 0; cursor: nwse-resize; } .rz.br::after { right: 4px; bottom: 4px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 4px; }
    .rz.tl, .rz.tr { top: 26px; } /* keep top handles clear of the title bar buttons */
    .rz.tl { top: 0; } .rz.tr { top: 0; right: 0; }

    @media (hover: hover) {
      .cam .cam-bar { opacity: 0; }
      .cam:hover .cam-bar, .cam.dragging .cam-bar, .cam:focus-within .cam-bar { opacity: 1; }
      .cam:hover .rz, .cam.dragging .rz { opacity: 1; }
    }
    @media (hover: none) {
      .rz { opacity: 0.9; width: 30px; height: 30px; }
    }
    /* keep the top-right resize handle from covering the buttons */
    .rz.tr { height: 12px; width: 12px; }
    .rz.tr::after { right: 2px; top: 2px; }

    /* shield stops iframes from swallowing pointer events while dragging */
    .shield { position: fixed; inset: 0; z-index: 9999; display: none; }
    body.is-dragging .shield { display: block; }
    body.is-dragging { user-select: none; -webkit-user-select: none; }

    /* ================= MOBILE BOTTOM BAR ================= */
    .bottombar {
      display: none; flex: 0 0 auto; gap: 8px;
      padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--line); z-index: 40;
    }
    .bottombar .btn { height: 46px; padding: 0 14px; flex: 1 1 0; font-size: 13px; }
    .bottombar .btn-donate { flex: 1.6 1 0; }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1100px) {
      .btn-kick span.lbl, .btn-discord span.lbl { display: none; }
      .btn-kick, .btn-discord { padding: 0; width: 42px; }
    }

    @media (max-width: 820px) {
      :root { --gap: 8px; --divider: 14px; --radius: 14px; }
      .topbar { padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); gap: 8px; }
      .brand-mark { width: 36px; height: 36px; font-size: 16px; border-radius: 11px; }
      .brand-name { font-size: 17px; }
      .actions { display: none; }
      .sep.desktop-only { display: none; }
      .bottombar { display: flex; }
      .layout { flex-direction: column; }
      .chat {
        flex: 0 0 min(var(--chat-h, 42%), 72%); width: 100%; height: min(var(--chat-h, 42%), 72%);
      }
      .divider { flex: 0 0 var(--divider); width: 100%; height: var(--divider); cursor: row-resize; }
      .divider::before { inset: -6px 0; }
      .divider .pill { width: 44px; height: 4px; }
      .divider:hover .pill, .divider.active .pill, .divider:focus-visible .pill { width: 72px; height: 4px; }
      .stage { min-height: 150px; }
      .icon-btn { width: 40px; height: 40px; }
    }

    @media (max-height: 520px) and (min-width: 821px) {
      .topbar { padding-top: 6px; padding-bottom: 6px; }
      .btn, .icon-btn { height: 36px; }
      .icon-btn { width: 36px; }
      .btn-kick, .btn-discord { width: auto; }
      .brand-mark { width: 34px; height: 34px; }
    }

    body.theater .topbar, body.theater .bottombar, body.theater .layout > .chat, body.theater .layout > .divider { display: none; }
    body.theater .layout { padding: 0; }
    body.theater .stage { border-radius: 0; border: 0; }
    .theater-exit { display: none; }
    body.theater .theater-exit {
      display: grid; position: absolute; top: 10px; left: 10px; z-index: 60; width: 38px; height: 38px;
      place-items: center; border-radius: 11px; background: rgba(0, 0, 0, 0.6); color: #fff;
      backdrop-filter: blur(8px);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shield" id="shield"></div>

  <div class="app">
    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <a class="brand" href="https://kick.com/aktor" target="_blank" rel="noopener noreferrer" aria-label="AKTOR na Kick">
        <span class="brand-mark"><i class="fa-solid fa-tower-broadcast"></i></span>
        <span class="brand-text">
          <span class="brand-name">Aktor</span>
          <span class="brand-sub"><span class="dot"></span>Stream &amp; czat</span>
        </span>
      </a>

      <div class="spacer"></div>

      <nav class="actions" aria-label="Linki">
        <a class="btn btn-discord" href="https://discord.com/invite/xj2qAYnwtM" target="_blank" rel="noopener noreferrer" title="Dołącz na Discord">
          <i class="fa-brands fa-discord"></i><span class="lbl">Discord</span>
        </a>
        <a class="btn btn-kick" href="https://kick.com/aktor" target="_blank" rel="noopener noreferrer" title="Kanał na Kick">
          <span class="kick-ico">K</span><span class="lbl">Kick</span>
        </a>
        <a class="btn btn-donate" href="https://tipply.pl/@aktor18" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-heart"></i>Donate
        </a>
      </nav>

      <span class="sep desktop-only"></span>

      <div class="tools">
        <button class="icon-btn on" id="btnCam" title="Kamerka (V)" aria-pressed="true" aria-label="Pokaż lub ukryj kamerkę"><i class="fa-solid fa-video"></i></button>
        <button class="icon-btn on" id="btnChat" title="Czat (C)" aria-pressed="true" aria-label="Pokaż lub ukryj czat"><i class="fa-solid fa-comments"></i></button>
        <button class="icon-btn" id="btnReload" title="Odśwież odtwarzacz" aria-label="Odśwież odtwarzacz"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="icon-btn" id="btnFull" title="Pełny ekran (F)" aria-label="Pełny ekran"><i class="fa-solid fa-expand"></i></button>
      </div>
    </header>

    <!-- ============ MAIN ============ -->
    <main class="layout" id="layout">
      <section class="stage" id="stage">
        <div class="loader"><div><div class="ring"></div>Ładowanie streamu</div></div>
        <iframe class="main" id="playerFrame"
          src="https://ok.ru/videoembed/16903368679018?nochat=1&autoplay=1"
          title="Stream"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"></iframe>

        <button class="theater-exit" id="btnTheaterExit" aria-label="Wyjdź z trybu kinowego"><i class="fa-solid fa-xmark"></i></button>

        <!-- Draggable + resizable webcam -->
        <div class="cam" id="cam">
          <iframe src="https://player.kick.cx/aktor" title="Kamerka" scrolling="no" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
          <div class="cam-bar move-window" id="camHandle">
            <span class="cam-label"><i class="fa-solid fa-grip"></i>Kamerka</span>
            <button class="cam-btn" id="camReset" title="Resetuj pozycję" aria-label="Resetuj pozycję kamerki"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="cam-btn close" id="camClose" title="Ukryj kamerkę" aria-label="Ukryj kamerkę"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <span class="rz tl" data-dir="tl"></span>
          <span class="rz tr" data-dir="tr"></span>
          <span class="rz bl" data-dir="bl"></span>
          <span class="rz br" data-dir="br"></span>
        </div>
      </section>

      <div class="divider" id="divider" role="separator" tabindex="0" aria-label="Zmień rozmiar czatu" title="Przeciągnij, aby zmienić rozmiar">
        <span class="pill"></span>
      </div>

      <aside class="chat" id="chat">
        <div class="chat-head">
          <div class="chat-title"><i class="fa-solid fa-comments"></i>Czat <span class="chat-tag">KICK</span></div>
          <div class="spacer"></div>
          <button class="icon-btn" id="chatReload" title="Odśwież czat" aria-label="Odśwież czat"><i class="fa-solid fa-rotate-right"></i></button>
          <button class="icon-btn" id="chatPop" title="Otwórz czat w nowym oknie" aria-label="Otwórz czat w nowym oknie"><i class="fa-solid fa-up-right-from-square"></i></button>
          <button class="icon-btn" id="chatHide" title="Ukryj czat" aria-label="Ukryj czat"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="chat-body">
          <div class="loader"><div><div class="ring"></div>Łączenie z czatem</div></div>
          <iframe id="chatFrame" src="https://chat.kick.cx/embed/aktor" title="Czat" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </aside>
    </main>

    <!-- ============ MOBILE ACTION BAR ============ -->
    <nav class="bottombar" aria-label="Linki">
      <a class="btn btn-donate" href="https://tipply.pl/@aktor18" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-heart"></i>Donate</a>
      <a class="btn btn-discord" href="https://discord.com/invite/xj2qAYnwtM" target="_blank" rel="noopener noreferrer" style="width:auto"><i class="fa-brands fa-discord"></i>Discord</a>
      <a class="btn btn-kick" href="https://kick.com/aktor" target="_blank" rel="noopener noreferrer" style="width:auto"><span class="kick-ico">K</span>Kick</a>
    </nav>
  </div>

  <script>
    (function () {
      const $ = (s) => document.querySelector(s);
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const store = {
        get(k, d) { try { const v = localStorage.getItem("aktor." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem("aktor." + k, JSON.stringify(v)); } catch (e) {} }
      };

      const layout = $("#layout"), stage = $("#stage"), chat = $("#chat"), divider = $("#divider");
      const cam = $("#cam"), camHandle = $("#camHandle");
      const btnCam = $("#btnCam"), btnChat = $("#btnChat"), btnReload = $("#btnReload"), btnFull = $("#btnFull");
      const playerFrame = $("#playerFrame"), chatFrame = $("#chatFrame");
      const mq = window.matchMedia("(max-width: 820px)");
      const root = document.documentElement;

      /* ---------- iframe loaders ---------- */
      function hideLoader(frame) {
        frame.addEventListener("load", () => {
          const l = frame.parentElement.querySelector(".loader");
          if (l) setTimeout(() => (l.style.display = "none"), 300);
        });
      }
      hideLoader(playerFrame);
      hideLoader(chatFrame);

      /* ---------- drag shield ---------- */
      function dragOn() { document.body.classList.add("is-dragging"); }
      function dragOff() { document.body.classList.remove("is-dragging"); document.body.style.cursor = ""; }

      /* =========================================================
         WEBCAM: draggable + resizable (pointer events, mouse+touch)
         ========================================================= */
      const AR = 16 / 9, MIN_W = 140, MAX_W = 720;
      const camState = Object.assign({ x: 0, y: 0, w: 0, custom: false, hidden: false }, store.get("cam", {}));
      let cur = { x: 0, y: 0, w: 280, h: 280 / AR };

      function defaultW(sw) {
        return sw < 600 ? clamp(sw * 0.38, 130, 200) : clamp(sw * 0.24, 220, 360);
      }

      function applyCam() {
        const sw = stage.clientWidth, sh = stage.clientHeight;
        if (!sw || !sh) return;
        const maxW = Math.max(MIN_W, Math.min(sw * 0.9, sh * 0.9 * AR, MAX_W));
        let w = clamp(camState.w || defaultW(sw), Math.min(MIN_W, maxW), maxW);
        const h = w / AR;
        let x, y;
        if (camState.custom) { x = camState.x; y = camState.y; }
        else { x = sw - w - 14; y = sh - h - (sw < 600 ? 14 : 64); }
        x = clamp(x, 0, Math.max(0, sw - w));
        y = clamp(y, 0, Math.max(0, sh - h));
        cur = { x, y, w, h };
        cam.style.left = x + "px";
        cam.style.top = y + "px";
        cam.style.width = w + "px";
        cam.style.height = h + "px";
      }

      function saveCam() {
        store.set("cam", { x: cur.x, y: cur.y, w: cur.w, custom: camState.custom, hidden: camState.hidden });
      }

      function setCamHidden(hidden) {
        camState.hidden = hidden;
        cam.classList.toggle("hidden", hidden);
        btnCam.classList.toggle("on", !hidden);
        btnCam.setAttribute("aria-pressed", String(!hidden));
        saveCam();
      }

      /* drag */
      let drag = null;
      camHandle.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".cam-btn")) return;
        if (e.pointerType === "mouse" && e.button !== 0) return;
        e.preventDefault();
        drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: cur.x, y: cur.y };
        try { camHandle.setPointerCapture(e.pointerId); } catch (err) {}
        cam.classList.add("dragging");
        dragOn();
        document.body.style.cursor = "grabbing";
      });
      camHandle.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        e.preventDefault();
        const sw = stage.clientWidth, sh = stage.clientHeight;
        camState.custom = true;
        camState.x = clamp(drag.x + (e.clientX - drag.sx), 0, Math.max(0, sw - cur.w));
        camState.y = clamp(drag.y + (e.clientY - drag.sy), 0, Math.max(0, sh - cur.h));
        camState.w = cur.w;
        applyCam();
      });
      function endDrag(e) {
        if (!drag || (e && e.pointerId !== drag.id)) return;
        drag = null;
        cam.classList.remove("dragging");
        dragOff();
        saveCam();
      }
      camHandle.addEventListener("pointerup", endDrag);
      camHandle.addEventListener("pointercancel", endDrag);

      /* resize from 4 corners (keeps 16:9) */
      let rs = null;
      cam.querySelectorAll(".rz").forEach((h) => {
        h.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          e.preventDefault(); e.stopPropagation();
          rs = { id: e.pointerId, dir: h.dataset.dir, sx: e.clientX, sy: e.clientY, s: Object.assign({}, cur), el: h };
          try { h.setPointerCapture(e.pointerId); } catch (err) {}
          cam.classList.add("dragging");
          dragOn();
          document.body.style.cursor = getComputedStyle(h).cursor;
        });
        h.addEventListener("pointermove", (e) => {
          if (!rs || e.pointerId !== rs.id) return;
          e.preventDefault();
          const sw = stage.clientWidth, sh = stage.clientHeight;
          const L = rs.dir.includes("l"), T = rs.dir.includes("t"), s = rs.s;
          const dx = (L ? -1 : 1) * (e.clientX - rs.sx);
          const dy = (T ? -1 : 1) * (e.clientY - rs.sy) * AR;
          let w = s.w + (Math.abs(dx) >= Math.abs(dy) ? dx : dy);
          const maxX = L ? s.x + s.w : sw - s.x;
          const maxY = (T ? s.y + s.h : sh - s.y) * AR;
          w = clamp(w, MIN_W, Math.max(MIN_W, Math.min(maxX, maxY, MAX_W)));
          const hh = w / AR;
          camState.custom = true;
          camState.w = w;
          camState.x = L ? s.x + s.w - w : s.x;
          camState.y = T ? s.y + s.h - hh : s.y;
          applyCam();
        });
        const end = (e) => {
          if (!rs || e.pointerId !== rs.id) return;
          rs = null; cam.classList.remove("dragging"); dragOff(); saveCam();
        };
        h.addEventListener("pointerup", end);
        h.addEventListener("pointercancel", end);
      });

      $("#camClose").addEventListener("click", () => setCamHidden(true));
      $("#camReset").addEventListener("click", () => {
        camState.custom = false; camState.w = 0; applyCam(); saveCam();
      });
      camHandle.addEventListener("dblclick", (e) => {
        if (e.target.closest(".cam-btn")) return;
        camState.custom = false; camState.w = 0; applyCam(); saveCam();
      });
      btnCam.addEventListener("click", () => setCamHidden(!camState.hidden));

      if ("ResizeObserver" in window) new ResizeObserver(applyCam).observe(stage);
      window.addEventListener("resize", applyCam);
      cam.classList.toggle("hidden", camState.hidden);
      btnCam.classList.toggle("on", !camState.hidden);
      btnCam.setAttribute("aria-pressed", String(!camState.hidden));
      applyCam();

      /* =========================================================
         CHAT: resizable + toggle
         ========================================================= */
      const sizes = Object.assign({ w: 380, h: null }, store.get("chat", {}));
      function applyChatSize() {
        root.style.setProperty("--chat-w", sizes.w + "px");
        if (sizes.h) root.style.setProperty("--chat-h", sizes.h + "px");
      }
      applyChatSize();

      function setChatHidden(hidden) {
        layout.classList.toggle("chat-hidden", hidden);
        btnChat.classList.toggle("on", !hidden);
        btnChat.setAttribute("aria-pressed", String(!hidden));
        store.set("chatHidden", hidden);
        requestAnimationFrame(applyCam);
      }
      btnChat.addEventListener("click", () => setChatHidden(!layout.classList.contains("chat-hidden")));
      $("#chatHide").addEventListener("click", () => setChatHidden(true));
      if (store.get("chatHidden", false)) setChatHidden(true);

      let dv = null;
      function setFromPointer(x, y) {
        const r = layout.getBoundingClientRect();
        const cs = getComputedStyle(layout);
        if (mq.matches) {
          const pb = parseFloat(cs.paddingBottom) || 0;
          const d = divider.offsetHeight / 2;
          sizes.h = clamp(r.bottom - pb - y - d, 130, r.height * 0.72);
        } else {
          const pr = parseFloat(cs.paddingRight) || 0;
          const d = divider.offsetWidth / 2;
          sizes.w = clamp(r.right - pr - x - d, 260, Math.min(720, r.width * 0.6));
        }
        applyChatSize();
      }
      divider.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        e.preventDefault();
        dv = e.pointerId;
        try { divider.setPointerCapture(e.pointerId); } catch (err) {}
        divider.classList.add("active");
        dragOn();
        document.body.style.cursor = mq.matches ? "row-resize" : "col-resize";
      });
      divider.addEventListener("pointermove", (e) => {
        if (dv === null || e.pointerId !== dv) return;
        e.preventDefault();
        setFromPointer(e.clientX, e.clientY);
      });
      function endDv(e) {
        if (dv === null || e.pointerId !== dv) return;
        dv = null; divider.classList.remove("active"); dragOff();
        store.set("chat", sizes);
      }
      divider.addEventListener("pointerup", endDv);
      divider.addEventListener("pointercancel", endDv);
      divider.addEventListener("dblclick", () => {
        sizes.w = 380; sizes.h = null; root.style.removeProperty("--chat-h"); applyChatSize(); store.set("chat", sizes);
      });
      divider.addEventListener("keydown", (e) => {
        const step = e.shiftKey ? 60 : 20;
        let used = true;
        if (mq.matches) {
          const base = sizes.h || chat.offsetHeight;
          if (e.key === "ArrowUp") sizes.h = base + step;
          else if (e.key === "ArrowDown") sizes.h = Math.max(130, base - step);
          else used = false;
        } else {
          if (e.key === "ArrowLeft") sizes.w = Math.min(720, sizes.w + step);
          else if (e.key === "ArrowRight") sizes.w = Math.max(260, sizes.w - step);
          else used = false;
        }
        if (used) { e.preventDefault(); applyChatSize(); store.set("chat", sizes); }
      });

      $("#chatReload").addEventListener("click", function () {
        const b = this; b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
        const l = chatFrame.parentElement.querySelector(".loader"); if (l) l.style.display = "grid";
        chatFrame.src = chatFrame.src;
      });
      $("#chatPop").addEventListener("click", () => {
        window.open("https://chat.kick.cx/embed/aktor", "aktor-chat", "popup=yes,width=420,height=720");
      });

      /* ---------- player reload ---------- */
      btnReload.addEventListener("click", () => {
        btnReload.classList.remove("spin"); void btnReload.offsetWidth; btnReload.classList.add("spin");
        const l = stage.querySelector(".loader"); if (l) l.style.display = "grid";
        playerFrame.src = playerFrame.src;
      });

      /* ---------- fullscreen / theater ---------- */
      const icon = btnFull.querySelector("i");
      function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function syncFs() {
        const on = !!isFs() || document.body.classList.contains("theater");
        icon.className = on ? "fa-solid fa-compress" : "fa-solid fa-expand";
        requestAnimationFrame(applyCam);
      }
      function toggleFs() {
        if (document.body.classList.contains("theater")) { document.body.classList.remove("theater"); syncFs(); return; }
        if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
        const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (req) { const p = req.call(stage); if (p && p.catch) p.catch(() => { document.body.classList.add("theater"); syncFs(); }); }
        else { document.body.classList.add("theater"); syncFs(); }
      }
      btnFull.addEventListener("click", toggleFs);
      $("#btnTheaterExit").addEventListener("click", toggleFs);
      document.addEventListener("fullscreenchange", syncFs);
      document.addEventListener("webkitfullscreenchange", syncFs);

      /* ---------- shortcuts ---------- */
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k === "c") btnChat.click();
        else if (k === "v") btnCam.click();
        else if (k === "f") toggleFs();
        else if (k === "escape" && document.body.classList.contains("theater")) toggleFs();
      });

      mq.addEventListener ? mq.addEventListener("change", applyCam) : mq.addListener(applyCam);
    })();
  </script>
</body>
</html>
