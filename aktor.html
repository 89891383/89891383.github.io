<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080b10" />
  <meta
    name="description"
    content="Transmisja na żywo Aktora — oglądaj i rozmawiaj na czacie."
  />

  <title>Aktor — transmisja na żywo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome Free — aktualna wersja z jsDelivr -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css"
  />

  <style>
    :root {
      color-scheme: dark;

      --bg: #080b10;
      --surface: #0d1118;
      --surface-raised: #111721;
      --surface-hover: #171e29;
      --border: rgba(220, 231, 245, 0.09);
      --border-strong: rgba(220, 231, 245, 0.14);

      --text: #f0f3f8;
      --muted: #929baa;
      --muted-strong: #b7bfcb;

      --accent: #b9f27c;
      --accent-dark: #17220e;
      --live: #ff626d;
      --online: #65dda0;

      --font-body: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Poppins", "Manrope", system-ui, sans-serif;

      --panel-radius: 18px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    .resize-handle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
      background:
        radial-gradient(ellipse 70% 45% at 12% 0%, rgba(78, 105, 155, 0.12), transparent 68%),
        radial-gradient(ellipse 55% 55% at 100% 100%, rgba(83, 135, 105, 0.05), transparent 72%),
        var(--bg);
    }

    /* ===== GÓRNY PASEK ===== */

    .topbar {
      z-index: 5;
      display: flex;
      flex: 0 0 70px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-width: 0;
      padding: 0 clamp(16px, 3vw, 34px);
      border-bottom: 1px solid var(--border);
      background: rgba(8, 11, 16, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 11px;
      min-width: 0;
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;
      color: #12190d;
      background: linear-gradient(145deg, #d5ffa5, #a5df69);
      box-shadow: 0 5px 18px rgba(185, 242, 124, 0.12);
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-copy strong {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.1;
    }

    .brand-copy small {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      line-height: 1.2;
    }

    .topbar-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .topbar-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted-strong);
    }

    .topbar-dot,
    .online-dot,
    .live-dot {
      display: inline-block;
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .topbar-dot,
    .online-dot {
      background: var(--online);
      box-shadow: 0 0 12px rgba(101, 221, 160, 0.42);
    }

    .topbar-dot {
      animation: status-pulse 2.4s ease-in-out infinite;
    }

    .topbar-divider {
      width: 1px;
      height: 16px;
      background: var(--border-strong);
    }

    .topbar-channel {
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 9px;
    }

    .channel-link,
    .support-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 39px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .channel-link {
      padding: 0 13px;
      border: 1px solid var(--border-strong);
      color: var(--muted-strong);
      background: rgba(255, 255, 255, 0.02);
    }

    .channel-link:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .support-link {
      padding: 0 15px;
      border: 1px solid rgba(185, 242, 124, 0.7);
      color: var(--accent-dark);
      background: var(--accent);
    }

    .support-link:hover {
      transform: translateY(-1px);
      border-color: #d4ffad;
      background: #c9fb9a;
      box-shadow: 0 7px 22px rgba(185, 242, 124, 0.13);
    }

    .support-link:active {
      transform: translateY(0);
    }

    /* ===== GŁÓWNY UKŁAD ===== */

    .workspace {
      --chat-width: 380px;

      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      padding: 14px 16px 16px;
    }

    .player-panel,
    .chat-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      background: var(--surface);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.18);
    }

    .player-panel {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
    }

    .video-shell {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }

    .video-shell iframe,
    .chat-frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #080a0e;
    }

    .video-badges {
      position: absolute;
      z-index: 2;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .video-live-badge,
    .video-channel-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 29px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f5f6f8;
      background: rgba(12, 15, 20, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.11em;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--live);
      box-shadow: 0 0 11px rgba(255, 98, 109, 0.46);
    }

    .video-channel-badge {
      color: #d4dae3;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .icon-button {
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      color: var(--muted-strong);
      background: rgba(255, 255, 255, 0.035);
      text-decoration: none;
      cursor: pointer;
      transition:
        color 150ms ease,
        background 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text);
      background: rgba(255, 255, 255, 0.09);
    }

    .fullscreen-button {
      position: absolute;
      z-index: 3;
      top: 14px;
      right: 14px;
      border-color: rgba(255, 255, 255, 0.13);
      color: #f5f6f8;
      background: rgba(12, 15, 20, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .video-shell:fullscreen,
    .video-shell:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      background: #000;
    }

    .video-shell:fullscreen iframe,
    .video-shell:-webkit-full-screen iframe {
      width: 100%;
      height: 100%;
    }

    .player-meta {
      display: flex;
      flex: 0 0 82px;
      align-items: center;
      gap: 13px;
      min-width: 0;
      padding: 0 18px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .creator-avatar {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(185, 242, 124, 0.22);
      border-radius: 14px;
      color: var(--accent);
      background:
        linear-gradient(145deg, rgba(185, 242, 124, 0.15), rgba(185, 242, 124, 0.035)),
        #121820;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 900;
    }

    .stream-copy {
      flex: 1 1 auto;
      min-width: 0;
    }

    .stream-copy h1 {
      overflow: hidden;
      margin: 0;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stream-copy p {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta-separator {
      color: #626c79;
    }

    .profile-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      color: var(--muted-strong);
      background: rgba(255, 255, 255, 0.025);
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      transition:
        color 150ms ease,
        background 150ms ease,
        border-color 150ms ease;
    }

    .profile-button:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }

    /* ===== UCHWYT DO ZMIANY ROZMIARU ===== */

    .resize-handle {
      position: relative;
      z-index: 4;
      display: grid;
      flex: 0 0 16px;
      width: 16px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .resize-handle::before {
      width: 4px;
      height: 42px;
      border-radius: 999px;
      background: #27303b;
      content: "";
      transition:
        background 150ms ease,
        box-shadow 150ms ease,
        height 150ms ease;
    }

    .resize-handle:hover::before,
    .resize-handle:focus-visible::before,
    .resize-handle.active::before {
      height: 50px;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(185, 242, 124, 0.28);
    }

    .chat-panel {
      display: flex;
      flex: 0 0 var(--chat-width, 380px);
      flex-direction: column;
      width: var(--chat-width, 380px);
    }

    /* ===== PANEL CZATU ===== */

    .chat-header {
      display: flex;
      flex: 0 0 70px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.012);
    }

    .chat-heading {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .chat-heading-icon {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--accent);
      background: rgba(185, 242, 124, 0.055);
      font-size: 14px;
    }

    .chat-heading-copy {
      min-width: 0;
    }

    .chat-heading h2 {
      overflow: hidden;
      margin: 0;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-heading p {
      overflow: hidden;
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-tools {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
    }

    .chat-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 27px;
      padding: 0 8px;
      border: 1px solid rgba(101, 221, 160, 0.13);
      border-radius: 8px;
      color: #9ce5b8;
      background: rgba(101, 221, 160, 0.055);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .chat-state .online-dot {
      width: 6px;
      height: 6px;
    }

    .chat-action {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 12px;
    }

    .chat-action.is-loading i {
      animation: spin 700ms linear infinite;
    }

    .chat-frame {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      background: #0a0d12;
    }

    .chat-footer {
      display: flex;
      flex: 0 0 38px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 0 13px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.012);
      font-size: 10px;
      font-weight: 600;
    }

    .chat-note,
    .chat-kick-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      white-space: nowrap;
    }

    .chat-note i {
      color: #8792a1;
      font-size: 10px;
    }

    .chat-kick-link {
      flex: 0 0 auto;
      color: var(--muted-strong);
      text-decoration: none;
      transition: color 150ms ease;
    }

    .chat-kick-link:hover {
      color: var(--accent);
    }

    /* ===== RESPONSYWNOŚĆ ===== */

    @media (max-width: 900px) {
      .workspace {
        flex-direction: column;
        padding: 10px 12px 12px;
      }

      .player-panel {
        --default-player-height: clamp(
          140px,
          min(calc(56.25vw - 18px), 42dvh),
          420px
        );

        flex: 0 0 var(--player-height, var(--default-player-height));
        width: 100%;
        height: var(--player-height, var(--default-player-height));
      }

      .resize-handle {
        flex: 0 0 16px;
        width: 100%;
        height: 16px;
        cursor: row-resize;
      }

      .resize-handle::before {
        width: 42px;
        height: 4px;
      }

      .resize-handle:hover::before,
      .resize-handle:focus-visible::before,
      .resize-handle.active::before {
        width: 52px;
        height: 4px;
      }

      .chat-panel {
        flex: 1 1 0;
        width: 100%;
        height: auto;
        min-height: 0;
      }
    }

    @media (max-width: 720px) {
      .topbar-center {
        display: none;
      }

      .topbar {
        gap: 12px;
        padding-right: 14px;
        padding-left: 14px;
      }

      .workspace {
        padding-right: 9px;
        padding-left: 9px;
      }

      .player-panel,
      .chat-panel {
        border-radius: 15px;
      }

      .player-meta {
        flex-basis: 72px;
        padding-right: 12px;
        padding-left: 12px;
      }

      .chat-header {
        flex-basis: 62px;
        padding-right: 11px;
        padding-left: 11px;
      }

      .chat-footer {
        flex-basis: 35px;
      }
    }

    @media (max-width: 560px) {
      .chat-state {
        display: none;
      }

      .chat-header {
        gap: 8px;
      }

      .chat-tools {
        gap: 5px;
      }

      .chat-note {
        gap: 5px;
      }

      .chat-footer {
        padding-right: 10px;
        padding-left: 10px;
        font-size: 9px;
      }
    }

    @media (max-width: 430px) {
      .topbar {
        flex-basis: 62px;
        min-height: 62px;
        padding-right: 12px;
        padding-left: 12px;
      }

      .brand {
        gap: 8px;
      }

      .brand-mark {
        flex-basis: 35px;
        width: 35px;
        height: 35px;
        border-radius: 12px;
      }

      .brand-copy small {
        display: none;
      }

      .topbar-actions {
        gap: 7px;
      }

      .channel-link {
        width: 37px;
        min-height: 37px;
        padding: 0;
      }

      .channel-link span,
      .profile-button span {
        display: none;
      }

      .support-link {
        min-height: 37px;
        padding-right: 11px;
        padding-left: 11px;
        font-size: 11px;
      }

      .player-meta {
        flex-basis: 66px;
        gap: 9px;
        padding-right: 10px;
        padding-left: 10px;
      }

      .creator-avatar {
        flex-basis: 36px;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        font-size: 15px;
      }

      .stream-copy h1 {
        font-size: 12px;
      }

      .stream-copy p {
        gap: 5px;
        font-size: 9px;
      }

      .profile-button {
        width: 36px;
        min-height: 36px;
        padding: 0;
      }

      .chat-heading-icon {
        flex-basis: 33px;
        width: 33px;
        height: 33px;
      }

      .chat-heading h2 {
        font-size: 12px;
      }

      .chat-heading p {
        font-size: 9px;
      }
    }

    @media (max-width: 900px) and (max-height: 560px) {
      .topbar {
        flex-basis: 56px;
        min-height: 56px;
      }

      .workspace {
        padding-top: 6px;
        padding-bottom: 8px;
      }

      .player-panel {
        --default-player-height: clamp(
          112px,
          min(calc(56.25vw - 18px), 34dvh),
          280px
        );
      }

      .player-meta {
        flex-basis: 58px;
      }

      .creator-avatar {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
      }

      .chat-header {
        flex-basis: 54px;
      }

      .chat-footer {
        display: none;
      }
    }

    /* ===== ANIMACJE I DOSTĘPNOŚĆ ===== */

    @keyframes status-pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(101, 221, 160, 0.32);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(101, 221, 160, 0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    body.is-resizing,
    body.is-resizing * {
      cursor: col-resize !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    body.is-resizing.is-stacked,
    body.is-resizing.is-stacked * {
      cursor: row-resize !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <a
        class="brand"
        href="https://kick.com/aktor"
        target="_blank"
        rel="noopener noreferrer"

      <div class="topbar-center" aria-label="Status transmisji">

    <main class="workspace" id="workspace">
      <section class="player-panel" id="playerPanel" aria-label="Odtwarzacz transmisji">
        <div class="video-shell" id="videoShell">
          <iframe
            src="https://ok.ru/videoembed/16903368679018?nochat=1&autoplay=1"
            title="Transmisja na żywo — Aktor"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>

          <div class="video-badges" aria-hidden="true">
            <span class="video-live-badge">
              <span class="live-dot"></span>
              NA ŻYWO
            </span>
            <span class="video-channel-badge">AKTOR · LIVE</span>
          </div>

          <button
            class="icon-button fullscreen-button"
            id="fullscreenButton"
            type="button"
            aria-label="Włącz pełny ekran"
            title="Włącz pełny ekran"
          >
            <i class="fa-solid fa-expand" aria-hidden="true"></i>
          </button>
        </div>

        <div class="player-meta">
          <div class="creator-avatar" aria-hidden="true">A</div>

          <div class="stream-copy">
            <h1>Aktor — transmisja na żywo</h1>
            <p>
              <span>Oficjalny stream</span>
              <span class="meta-separator" aria-hidden="true">·</span>
              <span>Rozmawiaj na czacie</span>
            </p>
          </div>

          <a
            class="profile-button"
            href="https://kick.com/aktor"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Otwórz kanał Aktora na Kicku"

      <div
        class="resize-handle"
        id="resizeHandle"
        role="separator"
        tabindex="0"
        aria-label="Zmień szerokość czatu"
        aria-orientation="vertical"
        aria-valuemin="280"
        aria-valuemax="520"
        aria-valuenow="380"
        aria-controls="playerPanel chatPanel"
        title="Przeciągnij, aby zmienić rozmiar paneli"
      ></div>

      <aside class="chat-panel" id="chatPanel" aria-label="Czat na żywo">
        <div class="chat-header">
          <div class="chat-heading">
            <span class="chat-heading-icon" aria-hidden="true">
              <i class="fa-solid fa-comments"></i>
            </span>

            <div class="chat-heading-copy">
              <h2>Czat na żywo</h2>
              <p>Społeczność Aktora</p>
            </div>
          </div>

          <div class="chat-tools">
            <span class="chat-state">
              <span class="online-dot" aria-hidden="true"></span>
              ONLINE
            </span>

            <button
              class="icon-button chat-action"
              id="reloadChatButton"
              type="button"
              aria-label="Odśwież czat"
              title="Odśwież czat"
            >
              <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>

            <a

              href="https://kick.com/aktor"

            id="chatFrame"

            title="Czat transmisji Aktora"
            allow="clipboard-write"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>

        <div class="chat-footer">
          <span class="chat-note">

            <span>Dbajmy o dobrą atmosferę</span>
          </span>

          <a
            class="chat-kick-link"
            href="https://kick.com/aktor"
            target="_blank"
            rel="noopener noreferrer"

            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>

  <script>
    (() => {
      const workspace = document.getElementById("workspace");
      const playerPanel = document.getElementById("playerPanel");
      const chatPanel = document.getElementById("chatPanel");
      const resizeHandle = document.getElementById("resizeHandle");
      const videoShell = document.getElementById("videoShell");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const chatFrame = document.getElementById("chatFrame");
      const reloadChatButton = document.getElementById("reloadChatButton");

      const stackedMedia = window.matchMedia("(max-width: 900px)");

      let dragging = false;
      let activePointerId = null;
      let pointerOffset = 0;
      let previousStacked = stackedMedia.matches;
      let manualPlayerRatio = null;
      let manualChatWidth = null;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const isStacked = () => stackedMedia.matches;

      function getWorkspaceMetrics() {
        const rect = workspace.getBoundingClientRect();
        const style = window.getComputedStyle(workspace);

        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        const paddingTop = parseFloat(style.paddingTop) || 0;
        const paddingBottom = parseFloat(style.paddingBottom) || 0;

        return {
          rect,
          paddingLeft,
          paddingRight,
          paddingTop,
          paddingBottom,
          contentWidth: Math.max(0, rect.width - paddingLeft - paddingRight),
          contentHeight: Math.max(0, rect.height - paddingTop - paddingBottom)
        };
      }

      function getChatLimits() {
        const { contentWidth } = getWorkspaceMetrics();
        const min = Math.min(280, contentWidth * 0.34);
        const max = Math.max(min, Math.min(520, contentWidth * 0.56));

        return { min, max };
      }

      function getPlayerLimits() {
        const { contentHeight } = getWorkspaceMetrics();
        const handleHeight = resizeHandle.getBoundingClientRect().height || 16;
        const availableHeight = Math.max(0, contentHeight - handleHeight);
        const maxByChat = availableHeight - 140;
        const min = Math.min(140, Math.max(96, maxByChat));
        const max = Math.max(
          min,
          Math.min(contentHeight * 0.68, maxByChat)
        );

        return { min, max, contentHeight };
      }

      function updateSeparator() {
        const stacked = isStacked();

        resizeHandle.setAttribute(
          "aria-orientation",
          stacked ? "horizontal" : "vertical"
        );
        resizeHandle.setAttribute(
          "aria-label",
          stacked
            ? "Zmień wysokość odtwarzacza i czatu"
            : "Zmień szerokość czatu"
        );

        if (stacked) {
          const { min, max } = getPlayerLimits();
          const value = playerPanel.getBoundingClientRect().height;

          resizeHandle.setAttribute("aria-valuemin", String(Math.round(min)));
          resizeHandle.setAttribute("aria-valuemax", String(Math.round(max)));
          resizeHandle.setAttribute("aria-valuenow", String(Math.round(value)));
          resizeHandle.setAttribute(
            "aria-valuetext",
            `${Math.round(value)} pikseli wysokości odtwarzacza`
          );
        } else {
          const { min, max } = getChatLimits();
          const value = chatPanel.getBoundingClientRect().width;

          resizeHandle.setAttribute("aria-valuemin", String(Math.round(min)));
          resizeHandle.setAttribute("aria-valuemax", String(Math.round(max)));
          resizeHandle.setAttribute("aria-valuenow", String(Math.round(value)));
          resizeHandle.setAttribute(
            "aria-valuetext",
            `${Math.round(value)} pikseli szerokości czatu`
          );
        }
      }

      function setChatWidth(value, remember = true) {
        const { min, max } = getChatLimits();
        const width = clamp(value, min, max);

        workspace.style.setProperty("--chat-width", `${width}px`);

        if (remember) {
          manualChatWidth = width;
        }

        updateSeparator();
      }

      function setPlayerHeight(value, remember = true) {
        const { min, max, contentHeight } = getPlayerLimits();
        const height = clamp(value, min, max);

        workspace.style.setProperty("--player-height", `${height}px`);

        if (remember && contentHeight > 0) {
          manualPlayerRatio = height / contentHeight;
        }

        updateSeparator();
      }

      function onPointerDown(event) {
        if (event.isPrimary === false) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;

        const rect = resizeHandle.getBoundingClientRect();
        pointerOffset = isStacked()
          ? event.clientY - rect.top
          : event.clientX - rect.left;

        dragging = true;
        activePointerId = event.pointerId;
        resizeHandle.classList.add("active");
        document.body.classList.add("is-resizing");
        document.body.classList.toggle("is-stacked", isStacked());

        resizeHandle.focus({ preventScroll: true });

        try {
          resizeHandle.setPointerCapture(event.pointerId);
        } catch (_) {
          // Pointer capture może być niedostępny w niektórych osadzonych widokach.
        }

        event.preventDefault();
      }

      function onPointerMove(event) {
        if (!dragging || event.pointerId !== activePointerId) return;

        event.preventDefault();

        const metrics = getWorkspaceMetrics();

        if (isStacked()) {
          const dividerTop = event.clientY - pointerOffset;
          const playerTop = metrics.rect.top + metrics.paddingTop;
          setPlayerHeight(dividerTop - playerTop);
        } else {
          const dividerLeft = event.clientX - pointerOffset;
          const handleWidth = resizeHandle.getBoundingClientRect().width;
          const chatRight = metrics.rect.right - metrics.paddingRight;
          const chatWidth = chatRight - (dividerLeft + handleWidth);

          setChatWidth(chatWidth);
        }
      }

      function stopDragging(event) {
        if (!dragging) return;
        if (event && event.pointerId !== activePointerId) return;

        const pointerId = activePointerId;

        dragging = false;
        activePointerId = null;

        resizeHandle.classList.remove("active");
        document.body.classList.remove("is-resizing");

        try {
          if (pointerId !== null && resizeHandle.hasPointerCapture(pointerId)) {
            resizeHandle.releasePointerCapture(pointerId);
          }
        } catch (_) {
          // Bezpieczne zakończenie również po pointercancel.
        }
      }

      function onSeparatorKeyDown(event) {
        const step = event.shiftKey ? 60 : 24;

        if (isStacked()) {
          const current = playerPanel.getBoundingClientRect().height;
          const limits = getPlayerLimits();

          if (event.key === "ArrowUp") {
            event.preventDefault();
            setPlayerHeight(current - step);
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            setPlayerHeight(current + step);
          } else if (event.key === "Home") {
            event.preventDefault();
            setPlayerHeight(limits.min);
          } else if (event.key === "End") {
            event.preventDefault();
            setPlayerHeight(limits.max);
          }
        } else {
          const current = chatPanel.getBoundingClientRect().width;
          const limits = getChatLimits();

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            setChatWidth(current + step);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            setChatWidth(current - step);
          } else if (event.key === "Home") {
            event.preventDefault();
            setChatWidth(limits.min);
          } else if (event.key === "End") {
            event.preventDefault();
            setChatWidth(limits.max);
          }
        }
      }

      function onResize() {
        const stacked = isStacked();

        document.body.classList.toggle("is-stacked", stacked);

        if (stacked !== previousStacked) {
          workspace.style.removeProperty("--player-height");
          manualPlayerRatio = null;
          previousStacked = stacked;
        }

        if (stacked && manualPlayerRatio !== null) {
          const { contentHeight } = getWorkspaceMetrics();
          setPlayerHeight(contentHeight * manualPlayerRatio, false);
        } else if (!stacked && manualChatWidth !== null) {
          setChatWidth(manualChatWidth, false);
        }

        updateSeparator();
      }

      resizeHandle.addEventListener("pointerdown", onPointerDown);
      resizeHandle.addEventListener("keydown", onSeparatorKeyDown);
      window.addEventListener("pointermove", onPointerMove, { passive: false });
      window.addEventListener("pointerup", stopDragging);
      window.addEventListener("pointercancel", stopDragging);
      window.addEventListener("resize", onResize, { passive: true });

      if (typeof stackedMedia.addEventListener === "function") {
        stackedMedia.addEventListener("change", onResize);
      }

      const fullscreenIcon = fullscreenButton.querySelector("i");

      function updateFullscreenButton() {
        const isFullscreen = document.fullscreenElement === videoShell;

        fullscreenButton.setAttribute(
          "aria-label",
          isFullscreen ? "Wyjdź z pełnego ekranu" : "Włącz pełny ekran"
        );
        fullscreenButton.setAttribute(
          "title",
          isFullscreen ? "Wyjdź z pełnego ekranu" : "Włącz pełny ekran"
        );

        fullscreenIcon.className = isFullscreen
          ? "fa-solid fa-compress"
          : "fa-solid fa-expand";
      }

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (videoShell.requestFullscreen) {
            await videoShell.requestFullscreen();
          }
        } catch (_) {
          // Pełny ekran może być zablokowany przez ustawienia przeglądarki.
        }
      });

      document.addEventListener("fullscreenchange", updateFullscreenButton);

      reloadChatButton.addEventListener("click", () => {
        const chatUrl = chatFrame.getAttribute("src");

        reloadChatButton.classList.add("is-loading");
        chatFrame.src = "about:blank";

        window.setTimeout(() => {
          chatFrame.src = chatUrl;
          window.setTimeout(() => {
            reloadChatButton.classList.remove("is-loading");
          }, 900);
        }, 60);
      });

      document.body.classList.toggle("is-stacked", isStacked());
      updateSeparator();
    })();
  </script>
</body>
