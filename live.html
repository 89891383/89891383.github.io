<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ===== PAGE SHELL: donate TOP + middle + donate BOTTOM ===== */
    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    /* ===== DONATE BARS (own layer, never covers player/chat) ===== */
    .donate-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      background: linear-gradient(180deg, #071a0c 0%, #0a1f10 100%);
      border-color: #1a3d24;
      z-index: 30;
    }

    .donate-bar.top {
      border-bottom: 1px solid #1a3d24;
    }

    .donate-bar.bottom {
      border-top: 1px solid #1a3d24;
    }

    .donate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: min(420px, 92vw);
      padding: 16px 40px;
      border: 2px solid #3dff7a;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: #04140a;
      font-family: "Arial Black", "Arial Black", Gadget, Impact, "Haettenschweiler", sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 3.2vw, 28px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #1aff6b 0%, #00e676 40%, #b8ff3c 100%);
      background-size: 200% 200%;
      box-shadow:
        0 0 0 0 rgba(26, 255, 107, 0.5),
        0 4px 20px rgba(0, 230, 118, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      animation:
        donate-pulse 2s ease-in-out infinite,
        donate-shine 3.5s ease infinite;
      transition: transform 0.15s ease, filter 0.15s ease;
      -webkit-font-smoothing: antialiased;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .donate:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    .donate:active {
      transform: scale(0.97);
    }

    .donate .cash {
      display: inline-block;
      font-size: 1.1em;
      line-height: 1;
      animation: cash-bounce 1.4s ease-in-out infinite;
    }

    @keyframes donate-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(26, 255, 107, 0.55), 0 4px 20px rgba(0, 230, 118, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
      70%  { box-shadow: 0 0 0 14px rgba(26, 255, 107, 0), 0 4px 20px rgba(0, 230, 118, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
      100% { box-shadow: 0 0 0 0 rgba(26, 255, 107, 0), 0 4px 20px rgba(0, 230, 118, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
    }

    @keyframes donate-shine {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes cash-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40%      { transform: translateY(-3px) scale(1.12); }
      60%      { transform: translateY(0) scale(1); }
    }

    /* ===== MIDDLE: player + chat ===== */
    .layout {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      width: 100%;
    }

    .player {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      background: #000;
      position: relative;
    }

    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .divider {
      flex: 0 0 5px;
      width: 5px;
      height: 100%;
      background: #1a1a1a;
      cursor: col-resize;
      position: relative;
      z-index: 20;
      transition: background 0.15s;
      touch-action: none;
      user-select: none;
    }

    .divider::after {
      content: "";
      position: absolute;
      top: 0;
      left: -4px;
      right: -4px;
      bottom: 0;
    }

    .divider:hover,
    .divider.active {
      background: #22c55e;
    }

    .divider:hover::before,
    .divider.active::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 3px;
      height: 40px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }

    .chat {
      flex: 0 0 var(--chat-w, 360px);
      width: var(--chat-w, 360px);
      height: 100%;
      background: #0f0f0f;
      position: relative;
      min-width: 0;
    }

    .chat iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .donate-bar {
        padding: 8px 12px;
      }

      .donate {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        padding: 14px 20px;
        font-size: 18px;
        border-radius: 12px;
      }

      .layout {
        flex-direction: column;
      }

      .player {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
      }

      .divider {
        flex: 0 0 5px;
        width: 100%;
        height: 5px;
        cursor: row-resize;
      }

      .divider::after {
        top: -4px;
        bottom: -4px;
        left: 0;
        right: 0;
      }

      .divider:hover::before,
      .divider.active::before {
        width: 40px;
        height: 3px;
      }

      .chat {
        flex: 0 0 var(--chat-h, 38%);
        width: 100%;
        height: var(--chat-h, 38%);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- TOP DONATE – always above player/chat -->
    <div class="donate-bar top">
      <a class="donate" href="https://kick.com/trazer" target="_blank" rel="noopener noreferrer">
        <span class="cash">$</span> DONATE <span class="cash">$</span>
      </a>
    </div>

    <!-- PLAYER + CHAT -->
    <div class="layout" id="layout">
      <div class="player" id="player">
        <iframe
          src="https://ok.ru/videoembed/16315266244202?nochat=1&autoplay=1"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <div class="divider" id="divider" title="Przeciągnij, aby zmienić szerokość"></div>

      <div class="chat" id="chat">
        <iframe
          src="https://chat.kick.cx/embed/trazer"
          allow="clipboard-write"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>

    <!-- BOTTOM DONATE – always below player/chat -->
    <div class="donate-bar bottom">
      <a class="donate" href="https://kick.com/trazer" target="_blank" rel="noopener noreferrer">
        <span class="cash">$</span> DONATE <span class="cash">$</span>
      </a>
    </div>
  </div>

  <script>
    (function () {
      const layout = document.getElementById("layout");
      const divider = document.getElementById("divider");
      const chat = document.getElementById("chat");

      const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

      let dragging = false;

      function clamp(val, min, max) {
        return Math.min(max, Math.max(min, val));
      }

      function applyDesktop(clientX) {
        const rect = layout.getBoundingClientRect();
        const total = rect.width;
        let chatW = total - (clientX - rect.left);
        chatW = clamp(chatW, 220, total * 0.55);
        document.documentElement.style.setProperty("--chat-w", chatW + "px");
        chat.style.flex = "0 0 " + chatW + "px";
        chat.style.width = chatW + "px";
        chat.style.height = "";
      }

      function applyMobile(clientY) {
        const rect = layout.getBoundingClientRect();
        const total = rect.height;
        let chatH = total - (clientY - rect.top);
        chatH = clamp(chatH, total * 0.2, total * 0.65);
        const pct = (chatH / total) * 100;
        document.documentElement.style.setProperty("--chat-h", pct + "%");
        chat.style.flex = "0 0 " + pct + "%";
        chat.style.height = pct + "%";
        chat.style.width = "100%";
      }

      function onMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const point = e.touches ? e.touches[0] : e;
        if (isMobile()) applyMobile(point.clientY);
        else applyDesktop(point.clientX);
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove("active");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      }

      function onDown(e) {
        dragging = true;
        divider.classList.add("active");
        document.body.style.cursor = isMobile() ? "row-resize" : "col-resize";
        document.body.style.userSelect = "none";
        e.preventDefault();
      }

      divider.addEventListener("mousedown", onDown);
      divider.addEventListener("touchstart", onDown, { passive: false });
      window.addEventListener("mousemove", onMove, { passive: false });
      window.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("mouseup", onUp);
      window.addEventListener("touchend", onUp);

      window.addEventListener("resize", function () {
        if (isMobile()) {
          chat.style.width = "100%";
          if (!chat.style.height) chat.style.flex = "0 0 38%";
        } else {
          chat.style.height = "";
          if (!chat.style.width || chat.style.width === "100%") {
            chat.style.flex = "0 0 360px";
            chat.style.width = "360px";
          }
        }
      });
    })();
  </script>
</body>
</html>
